<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleg — Kafe İşletim Sistemi | QR Menü, POS, Sadakat Tek Platformda</title>
<meta name="description" content="Türkiye ve dünya için kafe yönetim platformu. QR dijital menü, POS kasa, mutfak ekranı, sadakat programı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="module-deep.css">
<link rel="stylesheet" href="orderflow.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="map.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="orderflow.jsx"></script>
<script type="text/babel" src="module-deep.jsx"></script>
<script type="text/babel" src="footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "swiss",
  "accentColor": "#d05b3e",
  "heroHeadline": "Kafen,",
  "heroItalic": "nefes alıyor."
}/*EDITMODE-END*/;

function App() {
  const [modalOpen, setModalOpen] = useState(false);
  const [theme, setTheme] = useState(TWEAK_DEFAULTS.theme || 'warm');
  const [tweakMode, setTweakMode] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    if (theme !== tweaks.theme) {
      window.parent.postMessage({type: '__edit_mode_set_keys', edits: {theme}}, '*');
    }
  }, [theme]);

  useEffect(() => {
    // only apply custom accent if user actually changed it from the default
    if (tweaks.accentColor && tweaks.accentColor !== '#C4553A') {
      document.documentElement.style.setProperty('--accent', tweaks.accentColor);
    } else {
      document.documentElement.style.removeProperty('--accent');
    }
  }, [tweaks.accentColor, theme]);

  useEffect(() => {
    // reveal on scroll
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  // Tweaks protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const openDemo = () => setModalOpen(true);

  return (
    <>
      <Nav onDemo={openDemo} />
      <Hero onDemo={openDemo} />
      <Problems />
      <OrderFlow />
      <Features />
      <Steps />
      <Showcase />
      <MapSection />
      <Modules />
      <ModuleDeepDive />
      <Pricing onDemo={openDemo} />
      <Early onDemo={openDemo} />
      <FAQ />
      <FinalCTA onDemo={openDemo} />
      <Footer theme={theme} setTheme={setTheme} />
      <Modal open={modalOpen} onClose={() => setModalOpen(false)} />
      <WhatsAppFloat />
      {tweakMode && <TweakPanel tweaks={tweaks} setTweaks={setTweaks} theme={theme} setTheme={setTheme} />}
    </>
  );
}

function TweakPanel({ tweaks, setTweaks, theme, setTheme }) {
  const update = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[key]: val}}, '*');
  };
  return (
    <div style={{
      position:'fixed',bottom:100,right:26,zIndex:95,
      background:'var(--card)',border:'1px solid var(--line)',borderRadius:14,
      padding:20,width:280,boxShadow:'var(--shadow-3)'
    }}>
      <div className="mono" style={{marginBottom:14}}>Tweaks</div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div>
          <label className="mono" style={{display:'block',marginBottom:6}}>Tema</label>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:4}}>
            {['warm','espresso','swiss','editorial'].map(t => (
              <button key={t} onClick={() => setTheme(t)} style={{
                padding:'8px',fontSize:11,fontFamily:'var(--f-mono)',textTransform:'uppercase',
                background: theme===t ? 'var(--ink)' : 'var(--paper-2)',
                color: theme===t ? 'var(--paper)' : 'var(--ink)',
                border:'1px solid var(--line)',borderRadius:6,cursor:'pointer',letterSpacing:'0.08em'
              }}>{t}</button>
            ))}
          </div>
        </div>
        <div>
          <label className="mono" style={{display:'block',marginBottom:6}}>Accent</label>
          <input type="color" value={tweaks.accentColor} onChange={e => update('accentColor', e.target.value)}
            style={{width:'100%',height:36,border:'1px solid var(--line)',borderRadius:6,background:'transparent'}} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
