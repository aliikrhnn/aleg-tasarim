<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700;1,900&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital,wght@0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* font system — swappable via Tweaks */
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body:    'Bricolage Grotesque', system-ui, sans-serif;
    --font-mono:    'Bricolage Grotesque', ui-monospace,Menlo,monospace;
    --font-display-style: italic;
    --font-feature: "ss01","ss03","cv11";
    --font-variation: "SOFT" 100, "WONK" 0;

    /* warm café default */
    --paper: #F4EEE2;
    --paper-2: #EDE4D3;
    --paper-3: #E5D9C1;
    --ink: #2A1F18;
    --ink-2: #5A4A3D;
    --ink-3: #8C7A69;
    --line: #D6C9B2;
    --line-2: #C5B79C;
    --accent: #C4553A;     /* terracotta */
    --accent-ink: #8A3822;
    --accent-soft: #E8C9BD;
    --olive: #6B7A4B;
    --gold: #B08A3E;
    --ok: #4F7C4C;
    --warn: #B07A2E;
    --danger: #B84A3A;
    --card: #FAF5EA;
    --card-2: #FFFDF7;
    --shadow: 0 1px 2px rgba(42,31,24,.06), 0 8px 24px rgba(42,31,24,.06);
    --shadow-lg: 0 4px 10px rgba(42,31,24,.08), 0 24px 60px rgba(42,31,24,.14);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 22px;
  }
  [data-theme="espresso"]{
    --paper: #1A1410;
    --paper-2: #221A14;
    --paper-3: #2C2218;
    --ink: #F2E9DA;
    --ink-2: #C8B89E;
    --ink-3: #8C7A63;
    --line: #362A1F;
    --line-2: #4A3A2C;
    --accent: #E08060;
    --accent-ink: #F2A88A;
    --accent-soft: #3A2118;
    --card: #221A14;
    --card-2: #281F17;
  }
  [data-theme="swiss"]{
    --paper: #FAFAF7;
    --paper-2: #F2F1EC;
    --paper-3: #E7E6DF;
    --ink: #0B0B0A;
    --ink-2: #404040;
    --ink-3: #808078;
    --line: #DEDDD4;
    --line-2: #C4C3B8;
    --accent: #E33E1C;
    --accent-ink: #B2301A;
    --accent-soft: #FAD6CC;
    --card: #FFFFFF;
    --card-2: #FFFFFF;
  }
  [data-theme="editorial"]{
    --paper: #F2EEE8;
    --paper-2: #E8E0D2;
    --ink: #181412;
    --accent: #7E5B3A;
    --accent-soft: #DCCAB0;
    --card: #FAF6EE;
    --card-2: #FFFCF4;
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family: var(--font-body);
    font-optical-sizing:auto;
    font-variation-settings: var(--font-variation);
    font-feature-settings: var(--font-feature);
    font-synthesis: style weight;
    -webkit-font-smoothing:antialiased;
  }
  em, i, .serif { font-style: oblique 8deg; font-family: var(--font-body); }

  body{min-height:100vh;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:var(--card)}

  /* Paper texture */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(139,108,66,.04) 0, transparent 2px),
      radial-gradient(circle at 80% 70%, rgba(139,108,66,.04) 0, transparent 2px),
      radial-gradient(circle at 50% 10%, rgba(139,108,66,.03) 0, transparent 1.5px);
    background-size: 6px 6px, 8px 8px, 5px 5px;
  }
  [data-theme="espresso"] body::before,
  [data-theme="swiss"] body::before{display:none}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--paper)}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

  #root{position:relative;z-index:1}

  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes bell{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
  @keyframes steam{0%{opacity:0;transform:translateY(0) scaleX(1)}50%{opacity:.6}100%{opacity:0;transform:translateY(-10px) scaleX(1.4)}}
</style>
</head>
